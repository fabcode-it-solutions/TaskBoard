<div class="min-h-screen flex items-center justify-center p-4">
    <div class="w-auto">
        <tinn-page-header [title]="'Reset Password'" [subtitle]="'Enter your email to receive a password reset link'" [icon]="'lock_reset'"> </tinn-page-header>

        <!-- Forgot Password Form Card -->
        <div class="bg-neutral-100 border border-neutral-200 rounded-lg shadow-lg p-6">
            <form [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()">
                <div class="mb-4">
                    <label class="form-field-label">Email<tinn-mandatory-mark /></label>
                    <input
                        class="bg-neutral-200 text-default-font block w-full h-12 rounded-xs border border-neutral-300 px-4 placeholder:text-neutral-400 focus:border-green-500 focus:outline-none"
                        required
                        formControlName="email"
                        placeholder="johndoe@email.com" />
                    @if (forgotPasswordForm.get('email')?.hasError('required') && forgotPasswordForm.get('email')?.touched) {
                        <span class="form-field-error">Email is required</span>
                    } @else if (forgotPasswordForm.get('email')?.hasError('email') && forgotPasswordForm.get('email')?.touched) {
                        <span class="form-field-error">Please enter a valid email</span>
                    }
                </div>

                <!-- Submit Button -->
                <div class="flex justify-center">
                    <button [disabled]="loading()" class="brand-primary-button" type="submit">Send Reset Link</button>
                </div>

                <!-- Back to Login Link -->
                <div class="text-center mt-6">
                    <span class="text-gray-600 text-sm">Remember your password? </span>
                    <a routerLink="/auth/login" class="text-brand-800 text-sm font-semibold hover:underline">Login now</a>
                </div>
            </form>
        </div>
    </div>
</div>
