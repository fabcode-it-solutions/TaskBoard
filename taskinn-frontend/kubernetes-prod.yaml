apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskinn-frontend
  namespace: 25ws-ase-pr-inso-07
spec:
  selector:
    matchLabels:
      app: taskinn-frontend
  replicas: 1
  template:
    metadata:
      labels:
        app: taskinn-frontend
    spec:
      containers:
        - name: taskinn-frontend
          image: registry.reset.inso-w.at/2025ws-ase-pr-group/25ws-ase-pr-inso-07/frontend:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
              ephemeral-storage: "50Mi"
            limits:
              memory: "128Mi"
              cpu: "200m"
              ephemeral-storage: "50Mi"
          livenessProbe:
            httpGet:
              port: 80
              path: /health
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              port: 80
              path: /health
            initialDelaySeconds: 5
            periodSeconds: 10
      imagePullSecrets:
        - name: secret-dockercfg
---
apiVersion: v1
kind: Service
metadata:
  name: s-taskinn-frontend
  namespace: 25ws-ase-pr-inso-07
spec:
  type: ClusterIP
  selector:
    app: taskinn-frontend
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: taskinn-frontend-ingress
  namespace: 25ws-ase-pr-inso-07
  annotations:
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
spec:
  rules:
    - host: "25ws-ase-pr-inso-07.apps.student.inso-w.at"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: s-taskinn-frontend
                port:
                  number: 80
