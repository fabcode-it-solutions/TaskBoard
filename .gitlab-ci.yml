image: registry.reset.inso-w.at/pub/docker/debian-mvn

variables:
  GIT_STRATEGY: "clone"
  MAVEN_OPTS: "-Dmaven.repo.local=.m2"
  APP_PATH: "taskinn-backend"
  FRONTEND_PATH: "taskinn-frontend"
  K8S_NAMESPACE: "25ws-ase-pr-inso-07"
  BACKEND_IMAGE: "registry.reset.inso-w.at/$CI_PROJECT_PATH/backend"
  FRONTEND_IMAGE: "registry.reset.inso-w.at/$CI_PROJECT_PATH/frontend"

cache:
  paths:
    - .m2/
    - taskinn-frontend/node_modules/

stages:
  - test
  - verify
  - build
  - deploy

workflow:
  rules:
    # Run pipelines for tags
    - if: '$CI_COMMIT_TAG'
    # Run for merge requests
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    # Run for dev or master branches
    - if: '$CI_COMMIT_BRANCH =~ /^(dev|master)$/'
    # Run if .gitlab-ci.yml changes
    - changes:
        - .gitlab-ci.yml
    # Run only if backend or frontend folder changes
    - changes:
        - taskinn-backend/**
        - taskinn-frontend/**
    # Otherwise, skip the pipeline
    - when: never

# ---- Backend: test on MR, dev, master ----
test-backend:
  stage: test
  script:
    - cd "$APP_PATH"
    - mvn -B clean verify
  artifacts:
    when: always
    paths:
      - $APP_PATH/target/surefire-reports
      - $APP_PATH/target/failsafe-reports
    expire_in: 1h
  rules:
    # Run backend tests on MR to dev/master
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^(dev|master)$/'
      when: on_success
    # Run backend tests on pushes to dev/master
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH =~ /^(dev|master)$/'
      when: on_success
    - when: never

# ---- Backend: lint with spotless ----
lint-backend:
  stage: test
  script:
    - cd "$APP_PATH"
    - mvn -B spotless:check
  rules:
    # MR to dev/master
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^(dev|master)$/'
      when: on_success
    # Push to dev/master
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH =~ /^(dev|master)$/'
      when: on_success
    - when: never

# ---- Frontend: lint + prettier ----
lint-frontend:
  image: registry.reset.inso-w.at/pub/docker/node:current-alpine
  stage: test
  script:
    - cd "$FRONTEND_PATH"
    - npm ci
    - npm run lint
    - npm run prettier:check
  rules:
    # MR to dev/master
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^(dev|master)$/'
      when: on_success
    # Push to dev/master
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH =~ /^(dev|master)$/'
      when: on_success
    - when: never

# ---- Backend: build image (for MRs, verify only - no push) ----
verify-backend-image:
  stage: verify
  needs: ["test-backend"]
  script:
    - cd "$APP_PATH"
    - mvn -B -DskipTests clean package
  artifacts:
    paths:
      - $APP_PATH/target/*.jar
    expire_in: 1h
  rules:
    # Only on MRs - verify build works
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^(dev|master)$/'
      when: on_success
    - when: never

# ---- Frontend: build image (for MRs, verify only - no push) ----
verify-frontend-image:
  stage: verify
  image:
    name: ghcr.io/kaniko-build/dist/chainguard-dev-kaniko/executor:v1.25.5-debug
    entrypoint: [""]
  needs: ["lint-frontend"]
  script:
    - cd "$FRONTEND_PATH"
    - BUILD_CONFIG="production"
    - BASE_HREF="/"
    - |
      /kaniko/executor \
        --context "${CI_PROJECT_DIR}/${FRONTEND_PATH}" \
        --dockerfile "${CI_PROJECT_DIR}/${FRONTEND_PATH}/Dockerfile" \
        --build-arg BUILD_CONFIGURATION=${BUILD_CONFIG} \
        --build-arg BASE_HREF=${BASE_HREF} \
        --no-push \
        --tar-path=image.tar
  rules:
    # Only on MRs - verify build works
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^(dev|master)$/'
      when: on_success
    - when: never

build-frontend-image:
  stage: build
  image:
    name: ghcr.io/kaniko-build/dist/chainguard-dev-kaniko/executor:v1.25.5-debug
    entrypoint: [""]
  needs:
    - "lint-frontend"
  before_script:
    # Create Kaniko config for authentication
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"registry.reset.inso-w.at\":{\"auth\":\"$(printf "%s:%s" "${CI_REGISTRY_USER}" "${CI_REGISTRY_PASSWORD}" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
  script:
    - cd "$FRONTEND_PATH"
    # Determine build configuration and base href based on branch
    - |
      if [ "$CI_COMMIT_BRANCH" = "dev" ]; then
        BUILD_CONFIG="staging"
        BASE_HREF="/dev/"
      else
        BUILD_CONFIG="production"
        BASE_HREF="/"
      fi
    # Build and push frontend image using Kaniko
    - |
      /kaniko/executor \
        --context "${CI_PROJECT_DIR}/${FRONTEND_PATH}" \
        --dockerfile "${CI_PROJECT_DIR}/${FRONTEND_PATH}/Dockerfile" \
        --destination "${FRONTEND_IMAGE}:${CI_PIPELINE_ID}" \
        --destination "${FRONTEND_IMAGE}:latest" \
        --build-arg BUILD_CONFIGURATION=${BUILD_CONFIG} \
        --build-arg BASE_HREF=${BASE_HREF} \
        --cache=true \
        --cache-ttl=24h
  rules:
    # Only build images on *push* to dev/master (never on MR)
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH =~ /^(dev|master)$/'
      when: on_success
    - when: never

# ---- Backend: build + image ----
build-backend-image:
  stage: build
  needs:
    - "test-backend"
  script:
    # build backend + package
    - cd "$APP_PATH"
    - mvn -B -DskipTests clean package

    # build + push docker image using jib
    - |
      mvn -B jib:build \
      -Djib.to.image=$BACKEND_IMAGE \
      -Djib.to.tags=$CI_PIPELINE_ID,latest \
      -Djib.to.auth.username=$CI_REGISTRY_USER \
      -Djib.to.auth.password=$CI_REGISTRY_PASSWORD
  rules:
    # Only build images on *push* to dev/master (never on MR)
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH =~ /^(dev|master)$/'
      when: on_success
    - when: never

# ---- Deploy DEV ----
deploy-dev:
  stage: deploy
  image: registry.reset.inso-w.at/pub/docker/kubectl
  needs:
    - "build-backend-image"
    - "build-frontend-image"
  script:
    # Deploy backend
    - cd "$APP_PATH"
    - sed -i 's/:latest/:'"$CI_PIPELINE_ID"'/g' kubernetes-dev.yaml
    - kubectl -n "$K8S_NAMESPACE" apply -f kubernetes-dev.yaml
    # Deploy frontend
    - cd "../$FRONTEND_PATH"
    - sed -i 's/:latest/:'"$CI_PIPELINE_ID"'/g' kubernetes-dev.yaml
    - kubectl -n "$K8S_NAMESPACE" apply -f kubernetes-dev.yaml
  environment:
    name: dev
    url: https://$K8S_NAMESPACE.apps.student.inso-w.at/dev
  rules:
    # auto-deploy only on push to dev branch
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "dev"'
      when: on_success
    - when: never

# --- Backend: deploy PROD ----
deploy-prod:
  stage: deploy
  image: registry.reset.inso-w.at/pub/docker/kubectl
  needs:
    - "build-backend-image"
    - "build-frontend-image"
  script:
    # Deploy backend
    - cd "$APP_PATH"
    - sed -i 's/:latest/:'"$CI_PIPELINE_ID"'/g' kubernetes-prod.yaml
    - kubectl -n "$K8S_NAMESPACE" apply -f kubernetes-prod.yaml

    # Deploy frontend
    - cd "../$FRONTEND_PATH"
    - sed -i 's/:latest/:'"$CI_PIPELINE_ID"'/g' kubernetes-prod.yaml
    - kubectl -n "$K8S_NAMESPACE" apply -f kubernetes-prod.yaml
  environment:
    name: production
    url: https://$K8S_NAMESPACE.apps.student.inso-w.at/
  rules:
    # auto-deploy only on push to master branch
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "master"'
      when: on_success
    - when: never
