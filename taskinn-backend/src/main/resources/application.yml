    username: admin

  jpa:
    show-sql: false
    open-in-view: true
    hibernate:
      ddl-auto: update

  h2:
    console:
      enabled: false

# Application-specific configuration
app:
  frontend:
    base-url: http://localhost:4200
    reset-password-url: http://localhost:4200/auth/reset-password
  jwt:
    secret: change_me_dev_only_change_me_dev_only_change_me_dev_only
    access-ttl-seconds: 3600
  cors:
    allowed-origins: http://localhost:4200
  qr:
    token-ttl-seconds: 60
    exchange-timeout-seconds: 60
  dev:
    expose-reset-token: true
  datagen:
    staff-count: 40
    room-count: 135
    maintenance-ticket-count: 15
    guest-count: 350
    booking-count: 1500

# OpenAPI/Swagger configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: "health,info"

stripe:
  secret-key: KEY
  publishable-key: KEY
  webhook-secret: KEY
