# This file extends application.yml and overrides values for testing

file:
  storage-dir: "${java.io.tmpdir}/taskinn-test-files"

email:
  host: localhost
  port: 3025
  username: testuser
  password: testpass
  auth: false
  starttls-enable: false

scheduler:
  task:
    attempts: 2
    restarts: 5
    annealing-iterations: 20

spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=LEGACY

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  h2:
    console:
      enabled: false

app:
  jwt:
    secret: test-secret-key-for-unit-tests-minimum-32-bytes-required-for-hs256-algorithm
  dev:
    expose-reset-token: true

