apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskinn-backend
  namespace: 25ws-ase-pr-inso-07
spec:
  selector:
    matchLabels:
      app: taskinn-backend
  replicas: 1
  template:
    metadata:
      labels:
        app: taskinn-backend
    spec:
      containers:
        - name: taskinn-backend
          image: registry.reset.inso-w.at/2025ws-ase-pr-group/25ws-ase-pr-inso-07/backend:latest
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: STRIPE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: stripe-secrets
                  key: STRIPE_WEBHOOK_SECRET_PROD
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: "1024Mi"
              cpu: "50m"
              ephemeral-storage: "100Mi"
            limits:
              memory: "2048Mi"
              cpu: "500m"
              ephemeral-storage: "100Mi"
          livenessProbe:
            httpGet:
              port: 8080
              path: /actuator/health/liveness
            initialDelaySeconds: 120
            periodSeconds: 10
          readinessProbe:
            httpGet:
              port: 8080
              path: /actuator/health/readiness
            initialDelaySeconds: 120
            periodSeconds: 10
          startupProbe:
            httpGet:
              port: 8080
              path: /actuator/health
            initialDelaySeconds: 120
            periodSeconds: 10
            failureThreshold: 120
      imagePullSecrets:
        - name: secret-dockercfg
---
apiVersion: v1
kind: Service
metadata:
  name: s-taskinn-backend
  namespace: 25ws-ase-pr-inso-07
spec:
  type: ClusterIP
  selector:
    app: taskinn-backend
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: taskinn-backend-ingress
  namespace: 25ws-ase-pr-inso-07
  annotations:
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
spec:
  rules:
    - host: "25ws-ase-pr-inso-07.apps.student.inso-w.at"
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: s-taskinn-backend
                port:
                  number: 8080

          - path: /actuator
            pathType: Prefix
            backend:
              service:
                name: s-taskinn-backend
                port:
                  number: 8080

          # Swagger UI
          - path: /swagger-ui
            pathType: Prefix
            backend:
              service:
                name: s-taskinn-backend
                port:
                  number: 8080
          - path: /swagger-ui.html
            pathType: Prefix
            backend:
              service:
                name: s-taskinn-backend
                port:
                  number: 8080

          # OpenAPI docs
          - path: /v3/api-docs
            pathType: Prefix
            backend:
              service:
                name: s-taskinn-backend
                port:
                  number: 8080
          - path: /api-docs
            pathType: Prefix
            backend:
              service:
                name: s-taskinn-backend
                port:
                  number: 8080

          # WebSocket
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: s-taskinn-backend
                port:
                  number: 8080
